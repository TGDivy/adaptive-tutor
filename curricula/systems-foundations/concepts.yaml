    base_difficulty: 4
    exercise_types: [written, debugging, system_design, quiz]
    reference_files: [networking.md]
  - id: networking.protocol-framing
    name: Protocol framing
    domain: networking
    description: Design and parse messages correctly across arbitrary transport boundaries.
    importance: 1.3
    base_difficulty: 5
    exercise_types: [implementation, debugging, code_review, explain_the_code]
    reference_files: [networking.md]
  - id: networking.flow-control
    name: Flow control and buffering
    domain: networking
    description: Bound queues and propagate pressure across clients, servers, and transports.
