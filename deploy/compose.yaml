name: adaptive-tutor

x-runtime: &runtime
  image: adaptive-tutor:local
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      SOURCE_REVISION: ${SOURCE_REVISION:?Run ./prepare-compose.sh from deploy first}
  user: "${TUTOR_UID:-1000}:${TUTOR_GID:-1000}"
  environment:
    ADAPTIVE_TUTOR_CONFIG: /etc/adaptive-tutor/config.yaml
    ADAPTIVE_TUTOR_SOURCE_REVISION: ${SOURCE_REVISION:?Run ./prepare-compose.sh from deploy first}
    HOME: /var/lib/adaptive-tutor
    CODEX_HOME: /var/lib/adaptive-tutor-codex
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
  pids_limit: 256
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  tutor:
    <<: *runtime
    command: ["serve"]
    env_file:
      - path: ${TUTOR_RUNTIME_DIR:-./runtime}/tutor.env
        required: false
    volumes:
      - ${TUTOR_RUNTIME_DIR:-./runtime}/config:/etc/adaptive-tutor
      - ${TUTOR_RUNTIME_DIR:-./runtime}/state:/var/lib/adaptive-tutor
    ports:
      - "127.0.0.1:${TUTOR_PORT:-8765}:8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *runtime
    profiles: ["remote"]
    command: ["worker"]
    environment:
      ADAPTIVE_TUTOR_CONFIG: /etc/adaptive-tutor/config.yaml
      ADAPTIVE_TUTOR_GRADER_SOCKET: /run/adaptive-tutor-grader/grader.sock
      ADAPTIVE_TUTOR_SOURCE_REVISION: ${SOURCE_REVISION:?Run ./prepare-compose.sh from deploy first}
      HOME: /var/lib/adaptive-tutor
    env_file:
      - path: ${TUTOR_RUNTIME_DIR:-./runtime}/worker.env
        required: false
    volumes:
      - ${TUTOR_RUNTIME_DIR:-./runtime}/config:/etc/adaptive-tutor:ro
      - ${TUTOR_RUNTIME_DIR:-./runtime}/state:/var/lib/adaptive-tutor
      - ${TUTOR_RUNTIME_DIR:-./runtime}/grader-run:/run/adaptive-tutor-grader:ro
    depends_on:
      tutor:
        condition: service_healthy
      grader:
        condition: service_started
    healthcheck:
      disable: true

  grader:
    <<: *runtime
    profiles: ["remote"]
    command: ["grader", "--socket", "/run/adaptive-tutor-grader/grader.sock"]
    working_dir: /var/lib/adaptive-tutor-grader
    environment:
      HOME: /var/lib/adaptive-tutor-grader
      CODEX_HOME: /var/lib/adaptive-tutor-grader/codex
    env_file:
      - path: ${TUTOR_RUNTIME_DIR:-./runtime}/grader.env
        required: false
    volumes:
      - ${TUTOR_RUNTIME_DIR:-./runtime}/codex:/var/lib/adaptive-tutor-grader
      - ${TUTOR_RUNTIME_DIR:-./runtime}/grader-run:/run/adaptive-tutor-grader
    healthcheck:
      disable: true

  initializer:
    <<: *runtime
    profiles: ["tools"]
    command:
      - init
      - --data-dir
      - /var/lib/adaptive-tutor
      - --server-host
      - 0.0.0.0
    volumes:
      - ${TUTOR_RUNTIME_DIR:-./runtime}/config:/etc/adaptive-tutor
      - ${TUTOR_RUNTIME_DIR:-./runtime}/state:/var/lib/adaptive-tutor
    restart: "no"
    healthcheck:
      disable: true

  operator:
    <<: *runtime
    profiles: ["tools"]
    command: ["doctor", "--offline"]
    environment:
      ADAPTIVE_TUTOR_CONFIG: /etc/adaptive-tutor/config.yaml
      ADAPTIVE_TUTOR_GRADER_SOCKET: /run/adaptive-tutor-grader/grader.sock
      ADAPTIVE_TUTOR_SOURCE_REVISION: ${SOURCE_REVISION:?Run ./prepare-compose.sh from deploy first}
      HOME: /var/lib/adaptive-tutor
      CODEX_HOME: /var/lib/adaptive-tutor-codex
    volumes:
      - ${TUTOR_RUNTIME_DIR:-./runtime}/config:/etc/adaptive-tutor
      - ${TUTOR_RUNTIME_DIR:-./runtime}/state:/var/lib/adaptive-tutor
      - ${TUTOR_RUNTIME_DIR:-./runtime}/grader-run:/run/adaptive-tutor-grader:ro
    depends_on:
      tutor:
        condition: service_healthy
      grader:
        condition: service_started
    restart: "no"
    healthcheck:
      disable: true

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: ["live"]
    environment:
      TUTOR_DOMAIN: ${TUTOR_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      tutor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
