site_name: Adaptive Tutor
site_description: Self-hosted, Git-native adaptive learning engine
site_url: https://tgdivy.github.io/adaptive-tutor/
repo_url: https://github.com/TGDivy/adaptive-tutor
repo_name: TGDivy/adaptive-tutor
edit_uri: edit/main/docs/
copyright: Copyright &copy; Adaptive Tutor contributors

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: adaptive-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: adaptive-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Get started:
      - Installation: getting-started.md
      - CLI reference: cli.md
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
  - How it works:
      - Architecture: architecture.md
      - Adaptation: adaptation.md
      - Learner model: learner-model.md
      - Evaluation: evaluation.md
      - Codex worker: codex.md
  - Integrate:
      - GitHub App and webhooks: github.md
      - Curriculum authoring: curricula.md
      - Personal-agent API: api.md
  - Operate:
      - Security: security.md
      - Deployment and recovery: operations.md
  - Project:
      - Contributing: contributing.md
      - Completion contract: specification.md

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TGDivy/adaptive-tutor
      name: Adaptive Tutor on GitHub

strict: true
